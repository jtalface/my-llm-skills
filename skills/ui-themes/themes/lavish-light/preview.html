<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavish Light</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    <div class="lv-shell">
      <aside class="lv-sidebar">
        <div>
          <p class="lv-brand__mark">Lavish</p>
          <h1 class="lv-brand__title">Studio</h1>
          <p class="lv-brand__tag">Luxury product surfaces — espresso on cream.</p>
        </div>
        <nav class="lv-nav">
          <button type="button" class="lv-nav__item is-active">
            <span>Inbox</span><span class="lv-nav__meta">core</span>
          </button>
          <button type="button" class="lv-nav__item">
            <span>Preferences</span><span class="lv-nav__meta">settings</span>
          </button>
        </nav>
      </aside>
      <main class="lv-main">
        <div class="lv-stack">
          <header class="lv-header">
            <div>
              <h2>Notifications</h2>
              <p>DaisyUI luxury · mapped to lavish-light tokens</p>
            </div>
            <span class="lv-pill">3 unread</span>
          </header>
          <div class="lv-row">
            <button type="button" class="lv-btn">Primary</button>
            <button type="button" class="lv-btn lv-btn--ghost">Ghost</button>
          </div>
          <section class="lv-panel">
            <h3 class="lv-panel__label">Latest</h3>
            <div class="lv-card" style="margin-bottom: 0.65rem">
              <strong style="font-family: var(--font-display); font-size: 1.25rem">Maria mentioned you</strong>
              <p class="lv-muted" style="margin-top: 0.35rem">Can you review the Q3 deck?</p>
            </div>
            <div class="lv-card">
              <strong style="font-family: var(--font-display); font-size: 1.25rem">Billing</strong>
              <p class="lv-muted" style="margin-top: 0.35rem">Invoice ready · <code>n_1024</code></p>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
